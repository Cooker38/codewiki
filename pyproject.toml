[project]
name = "codewiki"
version = "0.1.0"
description = "Code knowledge graph + Wiki generation tool (CLI + MCP)"
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.26",
    "tree-sitter-java",
    "mcp[cli]>=1.27",
    "langgraph>=0.4",
    "openai",
    "GitPython",
    "typer",
    "python-dotenv",
    "pydantic",
    "httpx",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]
wiki = [
    "deepagents>=0.6",
    "langchain-openai>=0.3",
    "langgraph-checkpoint-sqlite>=0.1",
    "pyyaml>=6.0",
    "markdown>=3.5",
]

[project.scripts]
codewiki = "codewiki.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codewiki"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
